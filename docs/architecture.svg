<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .zt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bt { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .tx { font-size: 12px; fill: #334155; }
      .sm { font-size: 11px; fill: #475569; }
      .em { font-size: 12px; fill: #b91c1c; font-weight: 700; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; }
      .data { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#blue); }
      .ack { stroke: #15803d; stroke-width: 2; fill: none; marker-end: url(#green); }
      .cmd { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#red); }
      .link { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 2 4; }
    </style>
  </defs>

  <rect width="1600" height="1190" fill="#ffffff"/>
  <text x="20" y="36" font-size="22" font-weight="700" fill="#0f172a">폐쇄망 공장 엣지 게이트웨이 · 설비 통합 관제 — 구조와 데이터 흐름</text>
  <text x="20" y="58" class="tx">설비 1,000대(공장 A: MQTT 600, 공장 B: Modbus TCP 400) → 공장별 게이트웨이 → 회선 → 중앙 서버 · DB · 관제 화면. 굵은 숫자는 실제 설정값.</text>

  <!-- ================= ① 공장 ================= -->
  <rect x="20" y="78" width="460" height="300" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="34" y="102" class="zt">① 공장 A 폐쇄망 (외부로 나가는 연결만 허용)</text>

  <rect x="40" y="118" width="210" height="78" rx="6" class="box"/>
  <text x="52" y="139" class="bt">설비 600대 (MQTT)</text>
  <text x="52" y="158" class="tx">1초마다 seq·측정 시각 포함 발행</text>
  <text x="52" y="176" class="sm">장애 주입: 중복 1% · 순서 바뀜 1%</text>
  <text x="52" y="190" class="sm">· 지연 0~300ms</text>

  <rect x="40" y="250" width="210" height="62" rx="6" class="box"/>
  <text x="52" y="272" class="bt">Mosquitto 브로커</text>
  <text x="52" y="292" class="tx">QoS 1 · 게이트웨이 영속 세션</text>

  <rect x="290" y="170" width="170" height="128" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="302" y="192" class="bt">게이트웨이 A (gw-a)</text>
  <text x="302" y="212" class="tx">telemetry 토픽 구독</text>
  <text x="302" y="230" class="tx">디스크에 쓴 뒤에 PUBACK</text>
  <text x="302" y="248" class="tx">서버로 나가는 연결만</text>
  <text x="302" y="266" class="sm">(게이트웨이는 포트를</text>
  <text x="302" y="280" class="sm">열지 않는다)</text>

  <path d="M120,196 L120,248" class="data"/>
  <text x="128" y="216" class="sm">…/{deviceId}/telemetry</text>
  <path d="M168,248 L168,198" class="cmd"/>
  <text x="176" y="240" class="sm" fill="#dc2626">…/command</text>
  <path d="M250,268 L288,250" class="data"/>
  <path d="M288,282 L252,296" class="cmd"/>
  <text x="256" y="330" class="sm">명령 응답은 …/command/ack 토픽</text>

  <rect x="20" y="392" width="460" height="270" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="34" y="416" class="zt">① 공장 B 폐쇄망</text>

  <rect x="40" y="436" width="210" height="112" rx="6" class="box"/>
  <text x="52" y="458" class="bt">설비 400대 (Modbus TCP)</text>
  <text x="52" y="478" class="tx">라인 컨트롤러 4대</text>
  <text x="52" y="496" class="tx">포트 5020~5023 × unit 1~100</text>
  <text x="52" y="514" class="tx">레지스터 0~1 = 샘플 카운터(seq)</text>
  <text x="52" y="532" class="tx">레지스터 10 = 제어 (쓰기)</text>

  <rect x="290" y="436" width="170" height="112" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="302" y="458" class="bt">게이트웨이 B (gw-b)</text>
  <text x="302" y="478" class="tx"><tspan font-weight="700">0.5초</tspan>마다 폴링</text>
  <text x="302" y="496" class="tx">같은 seq 두 번 읽으면 버림</text>
  <text x="302" y="514" class="tx">명령: 상태 확인 → 쓰기</text>
  <text x="302" y="532" class="tx">→ 다시 읽어 확인</text>

  <path d="M250,470 L288,470" class="data"/>
  <path d="M288,514 L252,514" class="cmd"/>
  <text x="44" y="574" class="sm">Modbus엔 메시지 순번이 없어서 설비 카운터를 seq로 쓴다.</text>
  <text x="44" y="590" class="sm">측정 시각은 게이트웨이 폴링 시각.</text>
  <text x="44" y="616" class="tx">공장망은 docker <tspan font-weight="700">internal</tspan> 네트워크로 재현:</text>
  <text x="44" y="634" class="tx">밖으로 나가는 길은 회선(③) 하나뿐</text>

  <!-- 공장 게이트웨이 → 내부 확대 -->
  <path d="M460,234 L505,300" class="link"/>
  <path d="M460,492 L505,420" class="link"/>
  <text x="462" y="364" class="sm" fill="#64748b">내부</text>
  <text x="462" y="378" class="sm" fill="#64748b">확대 →</text>

  <!-- ================= ② 게이트웨이 내부 ================= -->
  <rect x="505" y="78" width="440" height="584" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="519" y="102" class="zt">② 게이트웨이 내부 (A·B 공통, 순수 Java)</text>

  <rect x="525" y="116" width="400" height="44" rx="6" class="box"/>
  <text x="537" y="135" class="bt">수집</text>
  <text x="577" y="135" class="tx">MqttCollector / ModbusCollector</text>
  <text x="537" y="152" class="sm">명령 수신도 같은 경로로 설비에 전달 (CommandService)</text>

  <rect x="525" y="180" width="400" height="48" rx="6" class="box"/>
  <text x="537" y="200" class="bt">정규화 → 공통 모델 TelemetryRecord</text>
  <text x="537" y="219" class="tx">프로토콜이 달라도 중복·순서 기준은 <tspan font-weight="700">(deviceId, seq)</tspan> 하나</text>

  <rect x="525" y="248" width="400" height="82" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="537" y="269" class="bt">SQLite outbox (디스크 버퍼)</text>
  <text x="537" y="288" class="tx">WAL + synchronous=FULL: 커밋돼야 "받았다"고 본다</text>
  <text x="537" y="305" class="tx">남아 있는 행 = 서버 저장이 확인되지 않은 행</text>
  <text x="537" y="322" class="tx">상한 <tspan font-weight="700">6시간분</tspan> 넘으면 가장 오래된 것부터 폐기 + 알람</text>

  <rect x="525" y="350" width="400" height="160" rx="6" class="box"/>
  <text x="537" y="371" class="bt">Uplink (전송) — 회선 복구 시 두 줄로 나눠 보낸다</text>
  <rect x="537" y="382" width="184" height="78" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="546" y="401" class="bt" font-size="12.5">실시간 줄</text>
  <text x="546" y="418" class="sm">연결 뒤 들어온 데이터</text>
  <text x="546" y="433" class="sm">항상 먼저 · 동시에 1묶음</text>
  <text x="546" y="448" class="sm">→ 화면이 바로 현재로</text>
  <rect x="729" y="382" width="184" height="78" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="738" y="401" class="bt" font-size="12.5">백필 줄</text>
  <text x="738" y="418" class="sm">연결 순간까지 쌓인 데이터</text>
  <text x="738" y="433" class="sm">오래된 순 · 동시에 2묶음</text>
  <text x="738" y="448" class="sm">→ 뒤에서 채워 넣기</text>
  <text x="537" y="479" class="tx">묶음 <tspan font-weight="700">2,000건</tspan> · ack 없이 <tspan font-weight="700">3묶음</tspan>까지 · <tspan font-weight="700">15초</tspan> 무응답이면 재연결</text>
  <text x="537" y="498" class="tx">범위 ack가 보낸 묶음과 <tspan font-weight="700">정확히 같을 때만</tspan> 그 범위 삭제</text>

  <rect x="525" y="530" width="400" height="48" rx="6" class="box"/>
  <text x="537" y="550" class="bt">WebSocketConnector</text>
  <text x="537" y="568" class="tx">게이트웨이가 먼저 연결 · 재연결 <tspan font-weight="700">0.5~30초</tspan> 지수 백오프 + 지터</text>

  <rect x="525" y="592" width="196" height="58" rx="6" class="box"/>
  <text x="535" y="611" class="bt" font-size="12.5">StatusReporter (5초)</text>
  <text x="535" y="628" class="sm">적체 건수 · 가장 오래된 나이</text>
  <text x="535" y="642" class="sm">· 활성 설비 · 폐기 건수</text>
  <rect x="729" y="592" width="196" height="58" rx="6" class="box"/>
  <text x="739" y="611" class="bt" font-size="12.5">CommandService</text>
  <text x="739" y="628" class="sm">commandId별 결과 기억</text>
  <text x="739" y="642" class="sm">→ 재시도가 와도 한 번만 실행</text>

  <path d="M725,160 L725,178" class="data"/>
  <path d="M725,228 L725,246" class="data"/>
  <path d="M725,330 L725,348" class="data"/>
  <path d="M725,510 L725,528" class="data"/>
  <path d="M925,445 C960,430 960,300 927,292" class="ack"/>
  <text x="936" y="352" class="sm" fill="#15803d">ack</text>
  <text x="936" y="366" class="sm" fill="#15803d">범위</text>
  <text x="936" y="380" class="sm" fill="#15803d">삭제</text>

  <!-- ================= ③ 회선 ================= -->
  <rect x="975" y="78" width="135" height="584" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="989" y="102" class="zt">③ 회선</text>
  <rect x="987" y="250" width="111" height="148" rx="6" class="box"/>
  <text x="997" y="272" class="bt">toxiproxy</text>
  <text x="997" y="292" class="sm">gw-a-uplink</text>
  <text x="997" y="306" class="sm">:18081</text>
  <text x="997" y="324" class="sm">gw-b-uplink</text>
  <text x="997" y="338" class="sm">:18082</text>
  <text x="997" y="360" class="sm">관리 API 8474로</text>
  <text x="997" y="374" class="sm">회선 끊기·복구</text>
  <text x="987" y="414" class="sm" fill="#1d4ed8">파랑 BATCH ↑</text>
  <text x="987" y="428" class="sm" fill="#15803d">초록 ACK ↓</text>
  <text x="987" y="442" class="sm" fill="#dc2626">빨강 COMMAND ↓</text>
  <text x="987" y="462" class="sm">WebSocket 하나로</text>
  <text x="987" y="476" class="sm">데이터는 올라가고</text>
  <text x="987" y="490" class="sm">명령은 같은 연결을</text>
  <text x="987" y="504" class="sm">거꾸로 내려간다</text>
  <text x="987" y="580" class="em">끊겨도 수집은</text>
  <text x="987" y="596" class="em">계속 → outbox에</text>
  <text x="987" y="612" class="em">적체</text>

  <path d="M925,546 C955,546 960,330 985,330" class="data"/>
  <path d="M985,356 C958,356 950,560 927,560" class="cmd"/>

  <!-- ================= ④ 중앙 ================= -->
  <rect x="1125" y="78" width="460" height="584" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="1139" y="102" class="zt">④ 중앙 (Spring Boot 4, 헥사고날)</text>

  <rect x="1140" y="116" width="255" height="52" rx="6" class="box"/>
  <text x="1150" y="137" class="bt">/ws/gateway</text>
  <text x="1150" y="156" class="tx">핸드셰이크에서 게이트웨이 토큰 인증</text>

  <path d="M1098,290 C1120,290 1115,150 1138,150" class="data"/>
  <path d="M1138,128 C1110,128 1122,314 1100,314" class="ack"/>
  <path d="M1138,140 C1104,140 1130,380 1100,380" class="cmd"/>

  <rect x="1140" y="186" width="255" height="122" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1150" y="207" class="bt">IngestService (한 트랜잭션)</text>
  <text x="1150" y="227" class="tx">① 중복 판정표에 (device_id, seq)</text>
  <text x="1164" y="243" class="tx">ON CONFLICT DO NOTHING</text>
  <text x="1150" y="261" class="tx">② 처음 본 것만 telemetry 저장</text>
  <text x="1150" y="279" class="tx">③ 현재 상태: seq가 클 때만 갱신</text>
  <text x="1150" y="298" class="em">④ 커밋 뒤에만 ACK(from, to)</text>

  <rect x="1140" y="326" width="255" height="74" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="1150" y="347" class="bt">CommandService</text>
  <text x="1150" y="366" class="tx">commandId 멱등 · <tspan font-weight="700">5초</tspan> 무응답 재시도</text>
  <text x="1150" y="383" class="tx">최대 <tspan font-weight="700">3회</tspan> · 모든 단계 감사 로그</text>

  <rect x="1140" y="418" width="255" height="70" rx="6" class="box"/>
  <text x="1150" y="439" class="bt">현재 상태 · 게이트웨이 상태 알림</text>
  <text x="1150" y="458" class="tx">변경분을 <tspan font-weight="700">0.25초</tspan>씩 묶어 화면 전송</text>
  <text x="1150" y="475" class="sm">(초당 1,000건을 하나씩 보내면 화면이 못 버팀)</text>

  <rect x="1140" y="506" width="255" height="62" rx="6" class="box"/>
  <text x="1150" y="527" class="bt">REST /api + 로그인 토큰</text>
  <text x="1150" y="546" class="tx">operator: 명령 가능</text>
  <text x="1150" y="561" class="tx">viewer: 조회만</text>

  <path d="M1267,168 L1267,184" class="data"/>
  <path d="M1138,362 L1131,362 L1131,158 L1138,158" class="cmd"/>

  <rect x="1410" y="116" width="162" height="284" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1422" y="138" class="bt">TimescaleDB</text>
  <text x="1422" y="162" class="tx" font-weight="700">telemetry</text>
  <text x="1422" y="177" class="sm">시계열 (hypertable)</text>
  <text x="1422" y="201" class="tx" font-weight="700">telemetry_dedup</text>
  <text x="1422" y="216" class="sm">(device_id, seq) 기본 키</text>
  <text x="1422" y="231" class="sm">= 중복 판정표, 2일 보관</text>
  <text x="1422" y="255" class="tx" font-weight="700">device_current</text>
  <text x="1422" y="270" class="sm">설비별 최신 1행</text>
  <text x="1422" y="294" class="tx" font-weight="700">command</text>
  <text x="1422" y="309" class="sm">명령 상태</text>
  <text x="1422" y="333" class="tx" font-weight="700">command_audit</text>
  <text x="1422" y="348" class="sm">감사 로그 (추가만)</text>
  <text x="1422" y="380" class="sm">스키마는 Flyway가 관리</text>

  <path d="M1395,246 L1408,246" class="data"/>
  <path d="M1395,362 L1408,362" class="cmd"/>

  <rect x="1410" y="418" width="162" height="150" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1422" y="440" class="bt">관제 UI</text>
  <text x="1422" y="458" class="sm">nginx + React</text>
  <text x="1422" y="478" class="tx">설비 현황 · 알람</text>
  <text x="1422" y="495" class="tx">명령과 결과</text>
  <text x="1422" y="512" class="tx">게이트웨이 연결·적체</text>
  <text x="1422" y="534" class="sm">/api, /ws를 서버로</text>
  <text x="1422" y="548" class="sm">프록시 (같은 주소)</text>

  <path d="M1395,452 L1408,452" class="data"/>
  <path d="M1408,536 L1397,536" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#gray)"/>
  <text x="1140" y="592" class="sm">UI가 만든 commandId로 명령 요청 → 더블클릭·HTTP 재전송도 명령 하나</text>
  <text x="1140" y="610" class="sm">서버 1대 전제: 세션·명령 잠금·게이트웨이 상태가 메모리 (12장)</text>

  <!-- ================= 범례 ================= -->
  <g transform="translate(1140,628)">
    <path d="M0,10 L36,10" class="data"/><text x="42" y="14" class="sm">데이터</text>
    <path d="M100,10 L136,10" class="ack"/><text x="142" y="14" class="sm">저장 확인(ack)</text>
    <path d="M240,10 L276,10" class="cmd"/><text x="282" y="14" class="sm">명령</text>
  </g>

  <!-- ================= 핵심 원칙 ================= -->
  <rect x="20" y="680" width="1010" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="708" class="zt">데이터 흐름의 핵심 — "유실 0건"은 이 8가지가 함께 만든다</text>

  <g class="tx" font-size="13">
    <text x="36" y="742"><tspan font-weight="700" fill="#1d4ed8">1. 디스크가 먼저.</tspan> 수집한 데이터는 outbox에 커밋된 뒤에야 "받았다"고 본다. MQTT는 그때 브로커에 PUBACK →</text>
    <text x="56" y="760">게이트웨이가 그 직전에 죽어도 브로커가 다시 준다.</text>

    <text x="36" y="792"><tspan font-weight="700" fill="#1d4ed8">2. 서버는 DB 커밋 뒤에만 ack.</tspan> 게이트웨이는 ack 받은 것만 지운다. 커밋 전에 회선·서버가 죽으면 ack가 없으므로</text>
    <text x="56" y="810">다시 보낸다. → 최소 한 번 전달.</text>

    <text x="36" y="842"><tspan font-weight="700" fill="#1d4ed8">3. 다시 보낸 것은 서버가 거른다.</tspan> 중복 판정표의 (device_id, seq) 기본 키. 최소 한 번 전달 + 중복 제거</text>
    <text x="56" y="860">= 결과적으로 정확히 한 번 저장. 설비 재발행·Modbus 중복 읽기도 같은 키로 걸러진다.</text>

    <text x="36" y="892"><tspan font-weight="700" fill="#1d4ed8">4. 범위 ack.</tspan> 서버는 받은 묶음의 from~to를 그대로 돌려주고, 게이트웨이는 보낸 묶음과 정확히 같을 때만 그 범위를 지운다.</text>
    <text x="56" y="910">outbox에 남은 것 = 확인 안 된 것이라, 재연결·재시작 때 따로 기록 없이 남은 것을 다시 보내면 된다.</text>

    <text x="36" y="942"><tspan font-weight="700" fill="#1d4ed8">5. 회선 복구 시 두 줄 전송.</tspan> 연결 순간까지 쌓인 것은 백필, 그 뒤 데이터는 실시간 줄로 먼저 보낸다.</text>
    <text x="56" y="960">밀린 수십만 건 뒤에 새 데이터가 줄 서지 않아 화면·알람이 곧바로 현재로 돌아온다.</text>

    <text x="36" y="992"><tspan font-weight="700" fill="#1d4ed8">6. 순서가 섞여도 안전.</tspan> 현재 상태는 seq가 클 때만 갱신하고, 시계열은 측정 시각 기준으로 쌓는다.</text>
    <text x="56" y="1010">늦게 도착한 옛 데이터(백필, 순서 바뀐 메시지)가 최신 값을 덮지 않는다.</text>

    <text x="36" y="1042"><tspan font-weight="700" fill="#dc2626">7. 명령은 같은 연결을 거꾸로.</tspan> 공장망은 밖으로 나가는 연결만 허용하므로 서버가 먼저 연결할 수 없다.</text>
    <text x="56" y="1060">commandId 멱등이 UI → 서버 → 게이트웨이 → 설비 네 단계에 모두 있어 재시도가 몇 번 와도 한 번만 적용된다.</text>

    <text x="36" y="1092"><tspan font-weight="700" fill="#b45309">8. 유실이 생길 수 있는 곳은 하나.</tspan> 단절이 6시간을 넘어 버퍼 상한을 넘을 때. 그때는 가장 오래된 것부터 버리고</text>
    <text x="56" y="1110">폐기 건수를 상태 보고로 올려 화면에 유실 알람을 띄운다 (조용히 잃지 않는다).</text>

    <text x="36" y="1146" class="sm">상세: docs/design.md 4장(아키텍처) · 6장(메시지 스키마) · 7장(인터페이스) · 8장(장애 시나리오)</text>
  </g>

