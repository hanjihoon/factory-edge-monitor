  <text x="1061" y="912" class="tx"><tspan font-weight="700" fill="#15803d">모든 측정에서 유실 0건 · 중복 0건</tspan></text>
  <text x="1061" y="932" class="sm">(에뮬레이터가 1% 중복을 주입하는데도 저장 결과 중복 0)</text>

  <text x="1061" y="968" class="tx" font-weight="700">정상 상태 (120초)</text>
  <text x="1061" y="988" class="tx">처리량 초당 991건 (설비 1,000대 × 1초)</text>
  <text x="1061" y="1006" class="tx">측정 → DB 저장 p95: 공장 A 1.7초 · 공장 B 1.0초</text>

  <text x="1061" y="1042" class="tx" font-weight="700">적체 해소 시간을 정하는 것</text>
  <text x="1061" y="1062" class="tx">비우는 시간 = 단절 시간 × 유입 ÷ (전송 − 유입)</text>
  <text x="1061" y="1080" class="sm">서버는 한 게이트웨이의 묶음을 순서대로 하나씩 처리한다.</text>
  <text x="1061" y="1095" class="sm">묶음당 고정 비용(문장 실행·커밋·현재 상태 갱신)이 병목이라</text>
  <text x="1061" y="1110" class="sm">묶음을 키우면(A) 빨라지고, 새 데이터를 먼저 보내면(C) 적체를</text>
  <text x="1061" y="1125" class="sm">비우는 동안에도 화면은 현재 값을 보여 준다 (지연 p95 1~3초).</text>
  <text x="1061" y="1146" class="sm">측정 방법: scripts/measure.sh · report.sql · recovery.sql (설계 문서 10장)</text>
