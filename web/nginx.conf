server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://server:8080;
        # $host는 포트를 뺀다(localhost). 브라우저 Origin은 포트를 포함하므로(localhost:8080) 서버의 같은 출처 검사가
        # 다른 출처로 보고 UI WebSocket을 403으로 거부했다. 포트까지 그대로 넘기는 $http_host를 쓴다
        proxy_set_header Host $http_host;
    }

    # WebSocket 업그레이드. 화면 연결은 계속 열려 있으므로 읽기 시간 제한을 길게
    location /ws/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $host는 포트를 뺀다(localhost). 브라우저 Origin은 포트를 포함하므로(localhost:8080) 서버의 같은 출처 검사가
        # 다른 출처로 보고 UI WebSocket을 403으로 거부했다. 포트까지 그대로 넘기는 $http_host를 쓴다
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
        access_log off; # 토큰이 쿼리에 있어 접근 로그에 남기지 않는다 (설계 문서 12장)
    }
}
