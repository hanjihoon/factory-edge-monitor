# 공장 A 내부 브로커. 공장망 안에서만 접근하므로 인증 없이 둔다 (가정: 공장 내부망은 물리적으로 분리).
listener 1883
allow_anonymous true

# 게이트웨이가 꺼진 동안(장애, 업데이트, 정전 뒤 늦은 부팅) 브로커가 대신 쌓아 두는 메시지 수 상한.
# 넘으면 브로커가 새 메시지를 버린다 → 유실. 그래서 이 값이 곧 "게이트웨이 정지 허용 시간"이다.
#   600대 × 1건/초 × 600초 = 360,000건 = 10분 (설계 문서 가정 13)
# 예전 값 100,000(약 166초)일 때 게이트웨이 200초 정지에서 25,592건 유실을 실측했다 (설계 문서 10장).
# 메모리는 쌓인 만큼만 쓴다. 게이트웨이가 붙어 있으면 대기열은 거의 비어 있다.
max_queued_messages 360000

# persistence를 켠다. 끄면 브로커가 재시작될 때 게이트웨이의 구독(영속 세션)까지 사라진다.
# 그러면 설비가 먼저 재연결해 보내는 메시지는 게이트웨이가 다시 구독하기 전까지 받을 곳이 없어 버려진다.
#   실측 (설계 문서 8장): persistence 끔 → 브로커 강제 종료 30초에 23,597건, 설정 변경용 일반 재시작에 20,807건 유실
#                         persistence 켬 → 같은 강제 종료에 1,726건 (93% 감소)
# 남는 손실은 강제 종료 순간 브로커 메모리에만 있던 약 2초분이다. Mosquitto persistence는 메시지마다 디스크에
# 쓰지 않고 메모리 전체를 주기적으로(autosave_interval) 저장하는 스냅숏이라 이 구간은 못 지킨다 → UPS (설계 가정 16).
# 스냅숏은 볼륨(mosquitto-data)에 남아 컨테이너를 새로 만들어도 구독이 유지된다.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
